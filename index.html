<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Saffron — Restaurant</title><style>*{box-sizing:border-box}body{margin:0;background:#11100e;color:#f7f1e7;font-family:Georgia,serif}nav{padding:20px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #40392f}.brand{font-size:23px;font-weight:900}.pill{border:1px solid #625747;border-radius:99px;padding:7px 12px;font:12px system-ui}.wrap{max-width:1100px;margin:auto;padding:55px 6%}.hero{padding:35px 0}.hero h1{font-size:clamp(45px,8vw,82px);line-height:.9;margin:15px 0}.gold{color:#d6aa62}.muted{color:#b7ad9f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#1a1815;border:1px solid #393229;border-radius:18px;padding:20px}.dish{height:145px;border-radius:13px;background:linear-gradient(135deg,#493c2c,#1d1812);display:flex;align-items:center;justify-content:center;font-size:38px}.btn{background:#d6aa62;color:#17120c;border:0;border-radius:10px;padding:12px 17px;font-weight:900;cursor:pointer}.cart{position:fixed;right:20px;bottom:20px;background:#1b1916;border:1px solid #51483c;border-radius:18px;padding:20px;width:min(390px,calc(100% - 40px))}</style></head><body><nav><div class="brand">MAISON <span class="gold">SAFFRON</span></div><span class="pill">PARIS • FRANCE</span></nav><main class="wrap"><section class="hero"><span class="pill">RESTAURANT • TAKEAWAY • DELIVERY</span><h1>La cuisine,<br><span class="gold">avec caractère.</span></h1><p class="muted">A premium restaurant website and digital ordering concept designed for a modern French dining brand.</p><button class="btn" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Découvrir la carte</button></section><h2 id="menu">La carte</h2><div id="menuGrid" class="grid"></div></main><div id="cart" class="cart" style="display:none"><h2>Votre commande</h2><div id="items"></div><button class="btn" onclick="alert('Démo de commande — aucune commande réelle n’est envoyée.')">Continuer</button></div><script>const dishes=[['Burrata des Pouilles','14 €'],['Risotto aux champignons','19 €'],['Magret de canard','26 €'],['Tarte citron maison','9 €'],['Saumon rôti','24 €'],['Fondant chocolat','10 €']];let order=[];document.getElementById('menuGrid').innerHTML=dishes.map((d,i)=>`<article class="card"><div class="dish">${['✦','◆','✺','◇','✦','◆'][i]}</div><h3>${d[0]}</h3><p class="muted">Sélection du chef</p><b class="gold">${d[1]}</b><br><br><button class="btn" onclick="add(${i})">Ajouter</button></article>`).join('');function add(i){order.push(dishes[i]);document.getElementById('cart').style.display='block';document.getElementById('items').innerHTML=order.map(d=>`<p>${d[0]} <b style="float:right">${d[1]}</b></p>`).join('')}</script></body></html>
